apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.metadataLabels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.metadataLabels" . | nindent 8 }}
      {{- with .Values.commonAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end}}

      {{- if or .Values.initContainers.fixPermissions.enabled .Values.initContainers.waitForService.enabled .Values.initContainers.dbMigration.enabled .Values.initContainers.custom }}
      initContainers:
        {{- if .Values.initContainers.fixPermissions.enabled }}
        - name: fix-permissions
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              echo "Fixing permissions for {{ .Values.initContainers.fixPermissions.path }}"
              chown -R {{ .Values.initContainers.fixPermissions.uid }}:{{ .Values.initContainers.fixPermissions.gid }} {{ .Values.initContainers.fixPermissions.path }}
              echo "Permissions fixed"
          volumeMounts:
            - name: {{ .Values.initContainers.fixPermissions.volumeName }}
              mountPath: {{ .Values.initContainers.fixPermissions.path }}
        {{- end }}

        {{- if .Values.initContainers.waitForService.enabled }}
        - name: wait-for-service
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for {{ .Values.initContainers.waitForService.host }}:{{ .Values.initContainers.waitForService.port }}"
              timeout {{ .Values.initContainers.waitForService.timeout }} sh -c 'until nc -z {{ .Values.initContainers.waitForService.host }} {{ .Values.initContainers.waitForService.port }}; do sleep 1; done'
              echo "Service is ready"
        {{- end }}

        {{- if .Values.initContainers.dbMigration.enabled }}
        - name: db-migration
          image: {{ .Values.initContainers.dbMigration.image | default (printf "%s:%s" .Values.image.repository .Values.image.tag) }}
          {{- with .Values.initContainers.dbMigration.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}

        {{- with .Values.initContainers.custom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}

          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- if .Values.envConfigMap.enabled }}
          envFrom:
            - configMapRef:
                name: {{ include "app.fullname" . }}-env
          {{- end }}

          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            {{- if eq .Values.probes.liveness.type "httpGet" }}
            httpGet:
              path: {{ .Values.probes.liveness.httpGet.path }}
              port: {{ .Values.probes.liveness.httpGet.port }}
              scheme: {{ .Values.probes.liveness.httpGet.scheme | default "HTTP" }}
            {{- else if eq .Values.probes.liveness.type "tcpSocket" }}
            tcpSocket:
              port: {{ .Values.probes.liveness.tcpSocket.port }}
            {{- else if eq .Values.probes.liveness.type "exec" }}
            exec:
              command:
                {{- toYaml .Values.probes.liveness.exec.command | nindent 16 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            successThreshold: {{ .Values.probes.liveness.successThreshold }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}

          {{- if .Values.probes.readiness.enabled }}
          livenessProbe:
            {{- if eq .Values.probes.readiness.type "httpGet" }}
            httpGet:
              path: {{ .Values.probes.readiness.httpGet.path }}
              port: {{ .Values.probes.readiness.httpGet.port }}
              scheme: {{ .Values.probes.readiness.httpGet.scheme | default "HTTP" }}
            {{- else if eq .Values.probes.readiness.type "tcpSocket" }}
            tcpSocket:
              port: {{ .Values.probes.readiness.tcpSocket.port }}
            {{- else if eq .Values.probes.readiness.type "exec" }}
            exec:
              command:
                {{- toYaml .Values.probes.readiness.exec.command | nindent 16 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}

          {{- if .Values.probes.startup.enabled }}
          livenessProbe:
            {{- if eq .Values.probes.startup.type "httpGet" }}
            httpGet:
              path: {{ .Values.probes.startup.httpGet.path }}
              port: {{ .Values.probes.startup.httpGet.port }}
              scheme: {{ .Values.probes.startup.httpGet.scheme | default "HTTP" }}
            {{- else if eq .Values.probes.startup.type "tcpSocket" }}
            tcpSocket:
              port: {{ .Values.probes.startup.tcpSocket.port }}
            {{- else if eq .Values.probes.startup.type "exec" }}
            exec:
              command:
                {{- toYaml .Values.probes.startup.exec.command | nindent 16 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            successThreshold: {{ .Values.probes.startup.successThreshold }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- if or .Values.volumes.mounts .Values.configMap.enabled }}
          volumeMounts:
            {{- range .Values.volumes.mounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- if .readOnly }}
              readOnly: {{ .readOnly }}
              {{- end }}
            {{- end }}
            {{- if .Values.configMap.enabled }}
            - name: config-files
              mountPath: {{ .Values.configMap.mountPath }}
            {{- end }}
          {{- end }}

        {{- if and .Values.metrics.enabled .Values.metrics.sidecar.enabled }}
        - name: metrics-exporter
          image: {{ .Values.metrics.sidecar.image }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.sidecar.port }}
          {{- with .Values.metrics.sidecar.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}

      {{- if or .Values.volumes.mounts .Values.configMap.enabled }}
      volumes:
        {{- range .Values.volumes.mounts }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ .name }}
        {{- end }}
        {{- if .Values.configMap.enabled }}
        - name: config-files
          configMap:
            name: {{ include "app.fullname" . }}-files
        {{- end }}
      {{- end }}
