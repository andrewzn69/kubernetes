name: Infrastructure CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  helm-validation:
    name: Validate helm charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Helm charts
        run: |
          echo "Linting all Helm charts..."
          find charts -maxdepth 2 -name Chart.yaml -exec dirname {} \; | while read chart; do
            helm dependency build "$chart" 2>/dev/null || true
            echo "==> Linting $chart"
            helm lint "$chart" --strict || exit 1
          done

      - name: Template and validate manifests
        run: |
          echo "Installing kubeconform..."
          wget -q https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          chmod +x kubeconform

          echo "Validating templated manifests..."
          find charts -maxdepth 2 -name Chart.yaml -exec dirname {} \; | while read chart; do
            helm dependency build "$chart" 2>/dev/null || true
            echo "==> Validating $chart"
            helm template test "$chart" | ./kubeconform -strict -summary -kubernetes-version 1.30.0 -ignore-missing-schemas || exit 1
          done

  argocd-apps-validation:
    name: Validate ArgoCD Applications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate ArgoCD app manifests
        run: |
          echo "Installing kubeconform..."
          wget -q https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          chmod +x kubeconform

          echo "Validating ArgoCD applications..."
          find apps -name "*.yaml" -o -name "*.yml" | while read app; do
            echo "==> Validating $app"
            ./kubeconform -strict -summary -ignore-missing-schemas "$app" || exit 1
          done

  security-scanning:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy scan (show results)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: 0

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Run KICS security scan
        uses: checkmarx/kics-github-action@v2.1.2
        with:
          path: '.'
          output_path: 'kics-results'
          output_formats: 'sarif'
          platform_type: 'kubernetes'
          fail_on: 'high,critical'
          enable_comments: false

      - name: Upload KICS results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('kics-results/results.sarif') != ''
        with:
          sarif_file: 'kics-results/results.sarif'
          category: 'kics'

  image-scanning:
    name: Scan Container Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          wget -qO ./yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x ./yq

      - name: Extract and scan images
        run: |
          echo "Extracting images from values files..."

          find charts -name "values.yaml" | while read values; do
            repo=$(./yq eval '.image.repository' "$values")
            tag=$(./yq eval '.image.tag' "$values")

            if [ "$repo" != "null" ] && [ "$tag" != "null" ]; then
              image="$repo:$tag"
              echo "==> Scanning $image"

              docker run --rm aquasec/trivy image \
                --severity HIGH,CRITICAL \
                --format table \
                "$image" || true
            fi
          done

  yaml-lint:
    name: YAML Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: charts/ apps/
          config_file: .yamllint.yaml
          strict: true

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [helm-validation, argocd-apps-validation, security-scanning, yaml-lint, image-scanning]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "=== CI Pipeline Summary ==="
          echo "Helm Validation: ${{ needs.helm-validation.result }}"
          echo "ArgoCD Apps Validation: ${{ needs.argocd-apps-validation.result }}"
          echo "Security Scanning: ${{ needs.security-scanning.result }}"
          echo "YAML Linting: ${{ needs.yaml-lint.result }}"

          if [ "${{ needs.helm-validation.result }}" != "success" ] || \
             [ "${{ needs.argocd-apps-validation.result }}" != "success" ] || \
             [ "${{ needs.security-scanning.result }}" != "success" ] || \
             [ "${{ needs.yaml-lint.result }}" != "success" ]; then
            echo "❌ CI pipeline failed"
            exit 1
          else
            echo "✅ CI pipeline passed"
          fi
