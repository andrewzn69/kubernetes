name: Validation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  helm-validation:
    name: Validate helm charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Lint Helm charts
        run: |
          echo "Linting all Helm charts..."
          find charts -maxdepth 2 -name Chart.yaml -exec dirname {} \; | while read chart; do
            helm dependency build "$chart" 2>/dev/null || true
            echo "==> Linting $chart"
            helm lint "$chart" --strict || exit 1
          done

      - name: Template and validate manifests
        run: |
          echo "Installing kubeconform..."
          wget -q https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          chmod +x kubeconform

          echo "Validating templated manifests..."
          find charts -maxdepth 2 -name Chart.yaml -exec dirname {} \; | while read chart; do
            helm dependency build "$chart" 2>/dev/null || true
            echo "==> Validating $chart"
            helm template test "$chart" | ./kubeconform -strict -summary -kubernetes-version 1.30.0 -ignore-missing-schemas || exit 1
          done

  argocd-apps-validation:
    name: Validate ArgoCD Applications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate ArgoCD app manifests
        run: |
          echo "Installing kubeconform..."
          wget -q https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          chmod +x kubeconform

          echo "Validating ArgoCD applications..."
          find apps -name "*.yaml" -o -name "*.yml" | while read app; do
            echo "==> Validating $app"
            ./kubeconform -strict -summary -ignore-missing-schemas "$app" || exit 1
          done

  yaml-lint:
    name: YAML Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: charts/ apps/
          config_file: .yamllint.yaml
          strict: true
