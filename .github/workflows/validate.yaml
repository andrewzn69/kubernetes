name: Validation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  setup-kubeconform:
    name: Setup Kubeconform
    runs-on: ubuntu-latest
    steps:
      - name: Download kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          chmod +x kubeconform

      - name: Upload kubeconform binary
        uses: actions/upload-artifact@v4
        with:
          name: kubeconform
          path: kubeconform
          retention-days: 1

  helm-validation:
    name: Validate helm charts
    runs-on: ubuntu-latest
    needs: setup-kubeconform
    env:
      KUBERNETES_VERSION: "1.35.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download kubeconform
        uses: actions/download-artifact@v4
        with:
          name: kubeconform

      - name: Make kubeconform executable
        run: chmod +x kubeconform

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Cache Helm dependencies
        uses: actions/cache@v4
        with:
          path: charts/**/charts
          key: helm-deps-${{ hashFiles('charts/**/Chart.lock') }}

      - name: Lint Helm charts
        run: |
          find charts -maxdepth 2 -name Chart.yaml -exec dirname {} \; | while read chart; do
            helm dependency build "$chart" 2>/dev/null || true
            echo "==> Linting $chart"
            helm lint "$chart" --strict || exit 1
          done

      - name: Template and validate manifests
        run: |
          find charts -maxdepth 2 -name Chart.yaml -exec dirname {} \; | while read chart; do
            helm dependency build "$chart" 2>/dev/null || true
            echo "==> Validating $chart"
            helm template test "$chart" | ./kubeconform -strict -summary -kubernetes-version $KUBERNETES_VERSION -ignore-missing-schemas || exit 1
          done

  argocd-apps-validation:
    name: Validate ArgoCD Applications
    runs-on: ubuntu-latest
    needs: setup-kubeconform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download kubeconform
        uses: actions/download-artifact@v4
        with:
          name: kubeconform

      - name: Make kubeconform executable
        run: chmod +x kubeconform

      - name: Validate ArgoCD app manifests
        run: |
          find apps -name "*.yaml" -o -name "*.yml" | while read app; do
            echo "==> Validating $app"
            ./kubeconform -strict -summary -ignore-missing-schemas "$app" || exit 1
          done
