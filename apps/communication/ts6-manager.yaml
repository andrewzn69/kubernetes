apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ts6-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/andrewzn69/kubernetes
    targetRevision: HEAD
    path: charts/communication/ts6-manager
    helm:
      releaseName: ts6-manager
  destination:
    server: https://130.162.228.5:6443
    namespace: communication
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
