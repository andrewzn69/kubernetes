apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tunnels
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/andrewzn69/kubernetes
    targetRevision: HEAD
    path: charts/infrastructure/tunnels
    helm:
      releaseName: tunnels
  destination:
    server: https://kubernetes.default.svc
    namespace: tunnels
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
