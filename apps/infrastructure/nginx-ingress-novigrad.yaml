apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress-novigrad
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/andrewzn69/kubernetes
    targetRevision: HEAD
    path: charts/infrastructure/nginx-ingress
    helm:
      valueFiles:
        - values-novigrad.yaml
  destination:
    server: https://130.61.47.29:6443
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
