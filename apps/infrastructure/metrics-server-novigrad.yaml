apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server-novigrad
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: "*"
    helm:
      releaseName: metrics-server
      values: |
        args:
          - --kubelet-insecure-tls
  destination:
    server: https://130.61.47.29:6443
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
