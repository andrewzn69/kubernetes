apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-novigrad
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/andrewzn69/kubernetes
    targetRevision: HEAD
    path: charts/infrastructure/sealed-secrets
    helm:
      releaseName: sealed-secrets
  destination:
    server: https://130.61.47.29:6443
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
