apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
  annotations:
    tailscale.com/hostname: {{ .Values.tailscale.hostname }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
    {{- range .Values.gateway.listeners }}
    - name: {{ .name }}
      port: {{ .port }}
      protocol: {{ .protocol }}
      {{- if .tls }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .tls.secretName }}
            namespace: {{ .tls.secretNamespace }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: {{ $.Values.gateway.allowedRoutes.namespaces }}
  {{- end }}
