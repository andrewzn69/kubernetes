apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.gatewayClassName }}
spec:
  controllerName: {{ .Values.gateway.controllerName }}
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: {{ .Values.gateway.gatewayClassName }}
    namespace: {{ .Values.gateway.namespace }}
