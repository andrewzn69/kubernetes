ingress-nginx:
  controller:
    service:
      type: NodePort
      nodePorts:
        tcp:
          7777: 30777
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
  tcp:
    7777: "terraria/terraria:7777"
