ingress-nginx:
  controller:
    service:
      type: ClusterIP
      clusterIP: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
    extraArgs:
      default-ssl-certificate: "default/zemn-wildcard-tls"
