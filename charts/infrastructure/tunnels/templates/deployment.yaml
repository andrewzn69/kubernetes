{{- if .Values.publicTunnel.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-public
  namespace: {{ .Release.Namespace }}
  labels:
    app: cloudflared-public
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-public
  template:
    metadata:
      labels:
        app: cloudflared-public
    spec:
      containers:
      - name: cloudflared
        image: {{ .Values.publicTunnel.image }}
        args:
          - tunnel
          - --config
          - /etc/cloudflared/config.yaml
          - run
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          failureThreshold: 1
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
          - name: config
            mountPath: /etc/cloudflared/config.yaml
            subPath: config.yaml
            readOnly: true
          - name: credentials
            mountPath: /etc/cloudflared/credentials.json
            subPath: credentials.json
            readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: cloudflared-public-config
        - name: credentials
          secret:
            secretName: {{ if .Values.publicTunnel.useExistingSecret }}{{ .Values.publicTunnel.existingSecretName }}{{ else }}cloudflared-public-secret{{ end }}
{{- end }}
