apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ondrejzeman23@gmail.com
    privateKeySecretRef:
      name: letsencrypt-cloudflare-key
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cert-manager-cloudflare-dns-token
            key: api-token
          zoneID: 7c1bb64051482ab8850aa01d418eff9a
      selector:
        dnsZones:
        - "zemn.xyz"
