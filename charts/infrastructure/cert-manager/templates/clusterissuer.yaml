apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.clusterIssuer.email }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.name }}-key
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: {{ .Values.clusterIssuer.cloudflare.tokenSecretName }}
            key: api-token
      selector:
        dnsZones:
          {{- range .Values.clusterIssuer.dnsZones }}
          - {{ . | quote }}
          {{- end }}
