apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zemn-wildcard
  namespace: cert-manager
spec:
  secretName: zemn-wildcard-tls
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "media,argocd,observability,productivity"
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
  - "zemn.xyz"
  - "*.zemn.xyz"
