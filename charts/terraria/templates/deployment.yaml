apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraria
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: terraria
  template:
    metadata:
      labels:
        app: terraria
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: inject-password
          image: busybox:latest
          command:
            - sh
            - -c
            - sed "s/PLACEHOLDER_PASSWORD/$(cat /secrets/password)/" /config-template/serverconfig.txt > /config/serverconfig.txt
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config
              mountPath: /config
            - name: password-secret
              mountPath: /secrets
      containers:
        - name: terraria
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: terraria
              containerPort: 7777
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - kill -TERM 1 && sleep 30
          env:
            - name: WORLD_FILENAME
              value: "{{ .Values.terraria.worldName }}.wld"
            - name: CONFIGPATH
              value: "/config"
            - name: CONFIG_FILENAME
              value: "serverconfig.txt"
          volumeMounts:
            - name: world-data
              mountPath: /root/.local/share/Terraria/Worlds
            - name: config
              mountPath: /config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: world-data
          persistentVolumeClaim:
            claimName: terraria-world-data
        - name: config-template
          configMap:
            name: terraria-config
        - name: config
          emptyDir: {}
        - name: password-secret
          secret:
            secretName: terraria-password
