# metadata
namespace: productivity
nameOverride: ""
fullnameOverride: ""

# optional labels
component: "bookmarks"      # server, exporter, worker
partOf: "productivity"         # media-stack, homelab, productivity
commonLabels: {}
commonAnnotations: {}

# replica count
replicaCount: 0

# container image
image:
  repository: sissbruecker/linkding
  tag: "1.44.2"
  pullPolicy: IfNotPresent

# storage backend
storage:
  type: nfs        # nfs | ceph
  class: ""        # storageClass for ceph/iscsi

# volumes
volumes:
  mounts:
    - name: data
      mountPath: /etc/linkding/data
      size: 2Gi
      accessMode: ReadWriteMany
      # NFS-specific (ignored if type != nfs)
      nfsServer: "100.64.100.64"
      nfsPath: "/storage/apps/linkding/data"

# secrets
secrets:
  type: sops       # sops | sealed | infisical | external

  # sops mode
  sops:
    enabled: false

  # infisical mode
  infisical:
    enabled: false
    secretsPath: /prod/app-name
    projectId: ""

  # external secrets mode (aws/azure/gcp)
  external:
    enabled: false
    provider: aws
    secretStore: aws-secret-store
    remoteRefs: []

# environment variables
env:
  - name: LD_CSRF_TRUSTED_ORIGINS
    value: "https://linkding.zemn.xyz"

# environment variables from configmap
envConfigMap:
  enabled: false
  data: {}

# config files from configmap
configMap:
  enabled: false
  mountPath: /config
  files: {}

# service
service:
  type: ClusterIP
  port: 9090
  targetPort: 9090
  protocol: TCP
  name: http

  additionalPorts: []

# ingress
ingress:
  enabled: true
  type: private    # public | private
  host: linkding.zemn.xyz
  path: /
  pathType: Prefix

  public:
    className: nginx
    tls:
      enabled: false
      secretName: ""
      clusterIssuer: letsencrypt-prod
    annotations: {}

  private:
    className: nginx
    tls:
      enabled: true
      secretName: zemn-wildcard-tls
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

# init containers
initContainers:
  fixPermissions:
    enabled: true
    volumeName: data
    path: /etc/linkding/data
    uid: 1000
    gid: 1000

  waitForService:
    enabled: false
    host: postgres
    port: 5432
    timeout: 300

  dbMigration:
    enabled: false
    image: ""
    command: []

  custom: []

# health probes
probes:
  liveness:
    enabled: true
    type: httpGet
    httpGet:
      path: /
      port: http
      scheme: HTTP
    tcpSocket:
      port: 8080
    exec:
      command: []
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  readiness:
    enabled: true
    type: httpGet
    httpGet:
      path: /
      port: http
      scheme: HTTP
    tcpSocket:
      port: 8080
    exec:
      command: []
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

  startup:
    enabled: false
    type: httpGet
    httpGet:
      path: /startup
      port: http
      scheme: HTTP
    tcpSocket:
      port: 8080
    exec:
      command: []
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 30

# metrics
metrics:
  enabled: false
  port: 9090
  path: /metrics

  serviceAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"

  sidecar:
    enabled: false
    image: ""
    port: 9707
    env: []

# resources
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# pod-level security context
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add: []

# node selector
nodeSelector: {}

# affinity
affinity: {}

# tolerations:
tolerations: []
