{{- if eq .Values.secrets.type "sops" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData: {}
  # add secrets here (will be encrypted with SOPS in git)
  # password: changeme
{{- end }}

{{- if eq .Values.secrets.type "sealed" }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  encryptedData: {}
    # encrypted with kubeseal
{{- end }}

{{- if eq .Values.secrets.type "infisical" }}
---
apiVersion: infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  secretsPath: {{ .Values.secrets.infisical.secretsPath }}
  projectId: {{ .Values.secrets.infisical.projectId }}
{{- end }}

{{- if eq .Values.secrets.type "external" }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.secrets.external.secretStore }}
  target:
    name: {{ include "app.fullname" . }}
  data:
  {{- range .Values.secrets.external.remoteRefs }}
  - secretKey: {{ .property }}
    remoteRef:
      key: {{ .key }}
      property: {{ .property }}
  {{- end }}
{{- end }}
