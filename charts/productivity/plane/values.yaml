namespace: productivity

# shared env vars injected into all app components
# DATABASE_URL and AMQP_URL contain passwords so they live in Infisical.
# REDIS_URL has no auth so it stays as a plain value.
# MINIO creds use AWS_* naming because plane uses the S3 SDK pointed at MinIO.
globalEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: plane
        key: DATABASE_URL
  - name: AMQP_URL
    valueFrom:
      secretKeyRef:
        name: plane
        key: AMQP_URL
  - name: REDIS_URL
    value: "redis://plane-valkey:6379"
  - name: AWS_REGION
    value: "us-east-1"
  - name: AWS_S3_ENDPOINT_URL
    value: "http://plane-minio:9000"
  - name: AWS_S3_BUCKET_NAME
    value: "uploads"
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: plane
        key: MINIO_ROOT_USER
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: plane
        key: MINIO_ROOT_PASSWORD
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: plane
        key: SECRET_KEY
  - name: LIVE_SERVER_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: plane
        key: LIVE_SERVER_SECRET_KEY
  - name: API_BASE_URL
    value: "http://plane-api:8000"

secrets:
  enabled: true
  type: infisical
  infisical:
    hostAPI: https://eu.infisical.com
    projectSlug: novigrad
    envSlug: prod
    secretsPath: /productivity/plane
    auth:
      credentialsSecretName: infisical-universal-auth
      credentialsSecretNamespace: infisical-system
    managedSecret:
      creationPolicy: Owner

components:
  web:
    image:
      repository: docker.io/makeplane/plane-frontend
      tag: "v1.3.0"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 3000
      targetPort: 3000
      protocol: TCP
      name: http

    cloudflare:
      enabled: true
      hostname: plane.zemn.xyz
      paths:
        - path: /
          pathType: Prefix

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

    replicaCount: 1
    volumes:
      emptyDir:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
    configMap:
      enabled: false
    initContainers:
      fixPermissions:
        enabled: false
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false
    metrics:
      enabled: false

  space:
    image:
      repository: docker.io/makeplane/plane-space
      tag: "v1.3.0"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 3000
      targetPort: 3000
      protocol: TCP
      name: http

    cloudflare:
      enabled: true
      hostname: plane.zemn.xyz
      paths:
        - path: /spaces
          pathType: Prefix

    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 250m

    replicaCount: 1
    volumes:
      emptyDir:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
    configMap:
      enabled: false
    initContainers:
      fixPermissions:
        enabled: false
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false
    metrics:
      enabled: false

  admin:
    image:
      repository: docker.io/makeplane/plane-admin
      tag: "v1.3.0"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 3000
      targetPort: 3000
      protocol: TCP
      name: http

    cloudflare:
      enabled: true
      hostname: plane.zemn.xyz
      paths:
        - path: /god-mode
          pathType: Prefix

    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 250m

    replicaCount: 1
    volumes:
      emptyDir:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
    configMap:
      enabled: false
    initContainers:
      fixPermissions:
        enabled: false
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false
    metrics:
      enabled: false

  live:
    image:
      repository: docker.io/makeplane/plane-live
      tag: "v1.3.0"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 3003
      targetPort: 3003
      protocol: TCP
      name: http

    cloudflare:
      enabled: false

    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 250m

    replicaCount: 1
    configMap:
      enabled: false
    initContainers:
      fixPermissions:
        enabled: false
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false
    metrics:
      enabled: false

  api:
    image:
      repository: docker.io/makeplane/plane-backend
      tag: "v1.3.0"
      pullPolicy: IfNotPresent

    command:
      - ./bin/docker-entrypoint-api.sh

    service:
      type: ClusterIP
      port: 8000
      targetPort: 8000
      protocol: TCP
      name: http

    cloudflare:
      enabled: true
      hostname: plane.zemn.xyz
      paths:
        - path: /api
          pathType: Prefix
        - path: /auth
          pathType: Prefix

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

    replicaCount: 1
    configMap:
      enabled: false
    initContainers:
      fixPermissions:
        enabled: false
      custom:
        - name: migrator
          image: docker.io/makeplane/plane-backend:v1.3.0
          command:
            - ./bin/docker-entrypoint-migrator.sh
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plane
                  key: DATABASE_URL
        - name: create-minio-bucket
          image: quay.io/minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set myminio http://plane-minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD; do
                echo "waiting for minio..."
                sleep 3
              done
              mc mb --ignore-existing myminio/uploads
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: plane
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plane
                  key: MINIO_ROOT_PASSWORD
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false
    metrics:
      enabled: false

  worker:
    image:
      repository: docker.io/makeplane/plane-backend
      tag: "v1.3.0"
      pullPolicy: IfNotPresent

    command:
      - ./bin/docker-entrypoint-worker.sh

    service:
      enabled: false

    cloudflare:
      enabled: false

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

    replicaCount: 1
    configMap:
      enabled: false
    initContainers:
      fixPermissions:
        enabled: false
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false
    metrics:
      enabled: false

  beat-worker:
    image:
      repository: docker.io/makeplane/plane-backend
      tag: "v1.3.0"
      pullPolicy: IfNotPresent

    command:
      - ./bin/docker-entrypoint-beat.sh

    service:
      enabled: false

    cloudflare:
      enabled: false

    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 100m

    replicaCount: 1
    configMap:
      enabled: false
    initContainers:
      fixPermissions:
        enabled: false
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false
    metrics:
      enabled: false

  rabbitmq:
    image:
      repository: docker.io/library/rabbitmq
      tag: "4.3.0-management-alpine"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 5672
      targetPort: 5672
      protocol: TCP
      name: amqp

    cloudflare:
      enabled: false

    env:
      - name: RABBITMQ_DEFAULT_USER
        value: "plane"
      - name: RABBITMQ_DEFAULT_PASS
        valueFrom:
          secretKeyRef:
            name: plane
            key: RABBITMQ_PASSWORD
      - name: RABBITMQ_DEFAULT_VHOST
        value: "plane"

    volumes:
      pvc:
        - name: data
          mountPath: /var/lib/rabbitmq
          size: 2Gi
          accessMode: ReadWriteOnce
          storageClassName: local-path

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

    replicaCount: 1
    configMap:
      enabled: false
    initContainers:
      fixPermissions:
        enabled: false
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false
    metrics:
      enabled: false

  postgres:
    image:
      repository: docker.io/library/postgres
      tag: "18.3-alpine3.22"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres

    cloudflare:
      enabled: false

    env:
      - name: POSTGRES_USER
        value: "plane"
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: plane
            key: DB_PASSWORD
      - name: POSTGRES_DB
        value: "plane"
      - name: PGDATA
        value: "/var/lib/postgresql/data/pgdata"

    volumes:
      pvc:
        - name: data
          mountPath: /var/lib/postgresql/data
          size: 10Gi
          accessMode: ReadWriteOnce
          storageClassName: local-path
      emptyDir:
        - name: run
          mountPath: /var/run/postgresql

    podSecurityContext:
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      runAsUser: 999
      runAsGroup: 999
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

    replicaCount: 1
    configMap:
      enabled: false
    initContainers:
      fixPermissions:
        enabled: false
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false
    metrics:
      enabled: false

  valkey:
    image:
      repository: docker.io/valkey/valkey
      tag: "9.0.3"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis

    cloudflare:
      enabled: false

    args:
      - --save ""
      - --appendonly no

    volumes:
      pvc:
        - name: data
          mountPath: /data
          size: 1Gi
          accessMode: ReadWriteOnce
          storageClassName: local-path

    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 100m

    replicaCount: 1
    configMap:
      enabled: false
    initContainers:
      fixPermissions:
        enabled: false
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false
    metrics:
      enabled: false

  minio:
    image:
      repository: quay.io/minio/minio
      tag: "RELEASE.2025-09-07T16-13-09Z"
      pullPolicy: IfNotPresent

    args:
      - server
      - /data
      - --console-address
      - ":9001"

    service:
      type: ClusterIP
      port: 9000
      targetPort: 9000
      protocol: TCP
      name: s3

    cloudflare:
      enabled: false

    env:
      - name: MINIO_ROOT_USER
        valueFrom:
          secretKeyRef:
            name: plane
            key: MINIO_ROOT_USER
      - name: MINIO_ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: plane
            key: MINIO_ROOT_PASSWORD

    volumes:
      pvc:
        - name: data
          mountPath: /data
          size: 20Gi
          accessMode: ReadWriteOnce
          storageClassName: local-path

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

    replicaCount: 1
    configMap:
      enabled: false
    initContainers:
      fixPermissions:
        enabled: false
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false
    metrics:
      enabled: false
