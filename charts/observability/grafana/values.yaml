nameOverride: ""
fullnameOverride: ""

namespace: observability

image:
  repository: grafana/grafana
  tag: "12.3.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

volumes:
  mounts:
    - name: grafana-data
      mountPath: /var/lib/grafana
      type: pvc
      readOnly: false
      pvc:
        nfsServer: "100.64.100.64"
        nfsPath: "/storage/apps/grafana/data"
        size: 10Gi
        accessMode: ReadWriteMany

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Gi
    cpu: 500m

securityContext:
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472
