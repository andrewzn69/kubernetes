{{- range .Values.volumes.mounts }}
{{- if eq .type "pvc" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  accessModes:
    - {{ .pvc.accessMode }}
  resources:
    requests:
      storage: {{ .pvc.size }}
  selector:
    matchLabels:
      app: {{ .name }}
{{- end }}
{{- end }}
