{{- if .Values.datasources }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-datasources
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "grafana.fullname" . }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      {{- range .Values.datasources }}
      - name: {{ .name }}
        type: {{ .type }}
        url: {{ .url }}
        access: {{ .access | default "proxy" }}
        isDefault: {{ .isDefault | default false }}
      {{- end }}
{{- end }}
