namespace: observability

image:
  repository: victoriametrics/victoria-metrics
  tag: "v1.130.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8428
  targetPort: 8428
  protocol: TCP
  name: http

gateway:
  enabled: true
  gatewayName: internal
  gatewayNamespace: kube-system
  hostname: victoria-metrics.internal.zemn.xyz
  path: /
  pathType: PathPrefix

args:
  - -retentionPeriod=5y
  - -storageDataPath=/victoria-metrics-data

volumes:
  pvc:
    - name: data
      mountPath: /victoria-metrics-data
      size: 10Gi
      accessMode: ReadWriteOnce
      storageClassName: longhorn

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 1000m

replicaCount: 1

configMap:
  enabled: false

initContainers:
  fixPermissions:
    enabled: false

probes:
  liveness:
    enabled: false
  readiness:
    enabled: false
  startup:
    enabled: false

metrics:
  enabled: false
