namespace: observability

components:
  victoria-logs:
    image:
      repository: victoriametrics/victoria-logs
      tag: "v1.24.0-victorialogs"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 9428
      targetPort: 9428
      protocol: TCP
      name: http

    gateway:
      enabled: true
      gatewayName: internal
      gatewayNamespace: gateway-system
      hostname: victoria-logs.internal.zemn.xyz
      path: /
      pathType: PathPrefix

    args:
      - -retentionPeriod=90d
      - -storageDataPath=/victoria-logs-data

    volumes:
      pvc:
        - name: data
          mountPath: /victoria-logs-data
          size: 10Gi
          accessMode: ReadWriteOnce
          storageClassName: longhorn
      emptyDir:
        - name: tmp
          mountPath: /tmp

    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 1000m

    podSecurityContext:
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    replicaCount: 1

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false

    metrics:
      enabled: false
