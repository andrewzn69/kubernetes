namespace: observability

image:
  repository: victoriametrics/victoria-logs
  tag: "v1.3.0-victorialogs"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9428
  targetPort: 9428
  protocol: TCP
  name: http

gateway:
  enabled: true
  gatewayName: internal
  gatewayNamespace: kube-system
  hostname: victoria-logs.internal.zemn.xyz
  path: /
  pathType: PathPrefix

args:
  - -retentionPeriod=90d
  - -storageDataPath=/victoria-logs-data

volumes:
  pvc:
    - name: data
      mountPath: /victoria-logs-data
      size: 50Gi
      accessMode: ReadWriteOnce
      storageClassName: longhorn

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 1000m

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

replicaCount: 1

configMap:
  enabled: false

initContainers:
  fixPermissions:
    enabled: false

probes:
  liveness:
    enabled: false
  readiness:
    enabled: false
  startup:
    enabled: false

metrics:
  enabled: false
