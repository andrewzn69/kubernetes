apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "victoria-logs.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "victoria-logs.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "victoria-logs.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "victoria-logs.fullname" . }}
    spec:
      securityContext:
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      containers:
        - name: victoria-logs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-storageDataPath=/victoria-logs-data"
            - "-retentionPeriod={{ .Values.retention }}"
            - "-httpListenAddr=:9428"
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          volumeMounts:
            {{- range .Values.volumes.mounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: {{ .readOnly }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        {{- range .Values.volumes.mounts }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ .name }}
        {{- end }}
