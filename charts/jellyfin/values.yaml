# chart metadata
nameOverride: ""
fullnameOverride: ""

# kubernetes namespace
namespace: media

# container image configuration
image:
  repository: docker.io/jellyfin/jellyfin
  tag: "10.10.7"
  pullPolicy: IfNotPresent

# service config
service:
  type: ClusterIP
  port: 8096
  targetPort: 8096

# volume config
volumes:
  mounts:
    - name: jellyfin-config
      mountPath: /config
      type: nfs
      readOnly: false
      nfs:
        server: 100.64.100.64
        path: /storage/apps/jellyfin
    - name: jellyfin-cache
      mountPath: /cache
      type: nfs
      readOnly: false
      nfs:
        server: 100.64.100.64
        path: /storage/apps/jellyfin/cache
    - name: jellyfin-shows
      mountPath: /media/Shows
      type: nfs
      readOnly: true
      nfs:
        server: 100.64.100.64
        path: /storage/media/shows
    - name: jellyfin-movies
      mountPath: /media/Movies
      type: nfs
      readOnly: true
      nfs:
        server: 100.64.100.64
        path: /storage/media/movies

# ingress config (disabled because using direct cf tunnel)
ingress:
  enabled: false
  className: nginx
  host: jellyfin.zemn.xyz
  tlsSecretName: zemn-wildcard-tls

# resource limits/requests
resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "2000m"

# security context
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
