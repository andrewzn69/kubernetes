argo-cd:
  global:
    domain: argocd.zemn.xyz
  server:
    insecure: true
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

      hosts:
        - argocd.zemn.xyz
      tls:
        - secretName: zemn-wildcard-tls
        - hosts:
            - argocd.zemn.xyz
