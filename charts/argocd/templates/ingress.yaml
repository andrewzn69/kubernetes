{{- if (index .Values "argo-cd").server.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-argocd-server
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml (index .Values "argo-cd").server.ingress.annotations | nindent 4 }}
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/managed-by: {{ .Release.Name }}
spec:
  rules:
  {{- range (index .Values "argo-cd").server.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $.Release.Name }}-argocd-server
            port:
              number: 80
  {{- end}}
  {{- if (index .Values "argo-cd").server.ingress.tls }}
  tls:
  {{- toYaml (index .Values "argo-cd").server.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}


