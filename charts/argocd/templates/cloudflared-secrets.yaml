{{- if .Values.cloudflared.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-cloudflared-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  cert.pem: {{ .Values.cloudflared.certPem }}
  tunnel-credentials.json: {{ .Values.cloudflared.tunnelCreds }}
{{- end }}
