{{- if .Values.exportarr.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prowlarr.fullname" . }}-exportarr
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "prowlarr.fullname" . }}-exportarr
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.exportarr.port }}
      targetPort: {{ .Values.exportarr.port }}
      name: metrics
  selector:
    app: {{ include "prowlarr.fullname" . }}-exportarr
{{- end }}
