namespace: media

image:
  repository: docker.io/flaresolverr/flaresolverr
  tag: "v3.4.6"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8191
  targetPort: 8191
  protocol: TCP
  name: http

gateway:
  enabled: true
  gatewayName: internal
  gatewayNamespace: gateway-system
  hostname: flaresolverr.internal.zemn.xyz
  path: /
  pathType: PathPrefix

volumes:
  emptyDir:
    - name: tmp
      mountPath: /tmp
    - name: local
      mountPath: /.local

resources:
  requests:
    memory: 256Mi
    cpu: 25m
  limits:
    memory: 512Mi
    cpu: 200m

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

replicaCount: 1

env:
  - name: HOME
    value: /tmp
  - name: LOG_LEVEL
    value: "info"
  - name: "TZ"
    value: "Europe/Prague"
