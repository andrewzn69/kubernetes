namespace: media

image:
  repository: docker.io/flaresolverr/flaresolverr
  tag: "v3.4.6"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8191
  targetPort: 8191
  protocol: TCP
  name: http

gateway:
  enabled: true
  gatewayName: internal
  gatewayNamespace: kube-system
  hostname: flaresolverr.internal.zemn.xyz
  path: /
  pathType: PathPrefix

resources:
  requests:
    memory: 256Mi
    cpu: 200m
  limits:
    memory: 512Mi
    cpu: 500m

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: false
  seccompProfile:
    type: RuntimeDefault

replicaCount: 1

env:
  - name: LOG_LEVEL
    value: "info"
  - name: "TZ"
    value: "Europe/Prague"
