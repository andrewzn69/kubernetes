namespace: media

image:
  repository: docker.io/linuxserver/qbittorrent
  tag: "5.1.2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  protocol: TCP
  name: http

gateway:
  enabled: true
  gatewayName: internal
  gatewayNamespace: kube-system
  hostname: qbittorrent.internal.zemn.xyz
  path: /
  pathType: PathPrefix

volumes:
  pvc:
    - name: config
      mountPath: /config
      size: 10Gi
      accessMode: ReadWriteOnce
      storageClassName: longhorn
  nfs:
    - name: downloads
      mountPath: /downloads
      server: "100.64.100.64"
      path: "/storage/downloads"
      readOnly: false

resources:
  requests:
    memory: 256Mi
    cpu: 200m
  limits:
    memory: 1Gi
    cpu: 1000m

env:
  - name: PUID
    value: "1000"
  - name: "PGID"
    value: "1000"
  - name: TZ
    value: "Europe/Prague"
  - name: WEBUI_PORT
    value: "8080"

replicaCount: 1

configMap:
  enabled: false

initContainers:
  fixPermissions:
    enabled: false

probes:
  liveness:
    enabled: false
  readiness:
    enabled: false
  startup:
    enabled: false

metrics:
  enabled: false
