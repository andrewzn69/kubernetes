namespace: media

components:
  slskd:
    image:
      repository: docker.io/slskd/slskd
      tag: "0.25.1"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 5030
      targetPort: 5030
      protocol: TCP
      name: http

    gateway:
      enabled: true
      gatewayName: internal
      gatewayNamespace: gateway-system
      hostname: slskd.internal.zemn.xyz
      path: /
      pathType: PathPrefix

    volumes:
      pvc:
        - name: data
          mountPath: /app
          size: 1Gi
          readOnly: false
          accessMode: ReadWriteOnce
          storageClassName: longhorn

      nfs:
        - name: downloads
          mountPath: /downloads
          server: "100.64.100.64"
          path: "/storage/downloads"
          readOnly: false

      emptyDir:
        - name: dotnet
          mountPath: /.net
        - name: tmp
          mountPath: /tmp

    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 512Mi
        cpu: 200m

    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    env:
      - name: SLSKD_REMOTE_CONFIGURATION
        value: "true"

    replicaCount: 1

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false

    metrics:
      enabled: false
