namespace: media

components:
  lidarr:
    image:
      repository: ghcr.io/home-operations/lidarr
      tag: "3.1.2"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 8686
      targetPort: 8686
      protocol: TCP
      name: http

    gateway:
      enabled: true
      gatewayName: internal
      gatewayNamespace: gateway-system
      hostname: lidarr.internal.zemn.xyz
      paths:
        - path: /
          pathType: PathPrefix

    volumes:
      pvc:
        - name: config
          mountPath: /config
          size: 5Gi
          readOnly: false
          accessMode: ReadWriteOnce
          storageClassName: longhorn

      nfs:
        - name: music
          mountPath: /music
          server: "100.64.100.64"
          path: "/storage/media/music"
          readOnly: false
        - name: downloads
          mountPath: /downloads
          server: "100.64.100.64"
          path: "/storage/downloads"
          readOnly: false

    resources:
      requests:
        memory: 128Mi
        cpu: 200m
      limits:
        memory: 256Mi
        cpu: 500m

    env:
      - name: TZ
        value: "Europe/Prague"

    replicaCount: 1

    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false

    metrics:
      enabled: false
