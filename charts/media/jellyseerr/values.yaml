namespace: media

image:
  repository: docker.io/fallenbagel/jellyseerr
  tag: "2.7.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5055
  targetPort: 5055
  protocol: TCP
  name: http

cloudflare:
  enabled: true
  hostname: jellyseerr.zemn.xyz
  path: /
  pathType: Prefix

volumes:
  pvc:
    - name: config
      mountPath: /app/config
      size: 5Gi
      accessMode: ReadWriteOnce
      storageClassName: local-path

resources:
  requests:
    memory: 256Mi
    cpu: 200m
  limits:
    memory: 512Mi
    cpu: 500m

env:
  - name: TZ
    value: "Europe/Prague"

replicaCount: 1

configMap:
  enabled: false

initContainers:
  fixPermissions:
    enabled: false

probes:
  liveness:
    enabled: false
  readiness:
    enabled: false
  startup:
    enabled: false

metrics:
  enabled: false
